<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Google Drive JSON 唯讀測試</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;color:#203040}label{display:block;margin:1rem 0 0}input{display:block;width:100%;box-sizing:border-box;font:inherit;padding:.6rem}button{margin:1rem 0;padding:.7rem 1rem;font:inherit}pre{background:#f2f5f7;padding:1rem;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#555}</style></head><body><h1>Google Drive JSON 唯讀測試</h1><p>只測試瀏覽器能否取得並解析公開 JSON；不寫入手機商品、不修改 Google Drive，也不取代正式公用更新來源。</p><label>檔案 ID<input id="fileid" value="1oOTsEWe8e1DZagxW9-3UHzbmXMFJ48An" autocomplete="off"></label><label>受限制的測試 API key<input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="只在此頁暫時輸入，不要貼到對話中"></label><small>請從允許的 GitHub Pages 網站開啟本頁；勿把 key 寫進 HTML 或網址。此頁不儲存 key，但瀏覽器網路請求仍會傳送至 Google。</small><br><button id="run" type="button">測試讀取（不套用）</button><pre id="result" role="status">尚未測試</pre><script>
const el=id=>document.getElementById(id);
el('run').addEventListener('click',async()=>{
 const key=el('key').value.trim(), fileId=el('fileid').value.trim(), out=el('result');
 if(!key||!fileId){out.textContent='請填檔案 ID 與測試 API key';return}
 out.textContent='讀取中…';
 const url=new URL('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fileId));url.searchParams.set('alt','media');url.searchParams.set('key',key);
 try{
  const res=await fetch(url.href,{method:'GET',cache:'no-store',referrerPolicy:'strict-origin-when-cross-origin'});
  const raw=await res.text();let data;try{data=JSON.parse(raw)}catch{out.textContent='HTTP '+res.status+'；回應不是 JSON（可能是 HTML 或下載頁）。';return}
  if(!res.ok){out.textContent='HTTP '+res.status+'；Google 錯誤：'+String(data.error?.message||'未知錯誤');return}
  if(!Array.isArray(data.products)){out.textContent='HTTP '+res.status+'；收到 JSON，但不含 products 陣列。';return}
  const records=data.products.reduce((n,p)=>n+(Array.isArray(p.records)?p.records.length:0),0);
  out.textContent='讀取成功（僅解析，沒有套用）\nHTTP '+res.status+'\n版本：'+String(data.releaseVersion??'缺少')+'\n商品：'+data.products.length+'（宣告 '+String(data.productCount??'缺少')+'）\n價格：'+records+'（宣告 '+String(data.recordCount??'缺少')+'）\n首筆條碼：'+String(data.products[0]?.barcode??'無')+'\n有效／已下架價格：'+data.products.flatMap(p=>p.records||[]).filter(r=>!r.isDeleted).length+'／'+data.products.flatMap(p=>p.records||[]).filter(r=>r.isDeleted).length;
 }catch(e){out.textContent='瀏覽器未取得可讀回應：'+String(e.message)+'。請檢查網路、CORS、API 設定或網站限制；不要貼出 key。'}
});
</script></body></html>
